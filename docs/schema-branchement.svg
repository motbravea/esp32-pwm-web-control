<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Branchement ESP32 GPIO18 vers résistance 220 ohms puis LED et GND">
<rect width="960" height="320" rx="24" fill="#f4f7fb"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e3750">Schéma de branchement — ESP32 / DEL / PWM</text>
<rect x="45" y="105" width="185" height="120" rx="15" fill="#163b55"/>
<text x="137" y="151" fill="#fff" font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="bold">ESP32</text>
<text x="137" y="184" fill="#cde5f3" font-family="Arial,sans-serif" text-anchor="middle" font-size="19">GPIO18</text>
<path d="M230 165 H342" stroke="#d8a226" stroke-width="7" fill="none"/>
<rect x="342" y="148" width="147" height="34" rx="9" fill="#ebca91" stroke="#aa7a2a" stroke-width="3"/>
<path d="M359 149 V181 M380 149 V181 M401 149 V181" stroke="#ad3d3d" stroke-width="7"/>
<text x="416" y="208" font-family="Arial,sans-serif" fill="#263e52" font-size="17" text-anchor="middle">220 Ω</text>
<path d="M489 165 H616" stroke="#d8a226" stroke-width="7" fill="none"/>
<path d="M616 165 l45 -31 v62 z" fill="#ef4545" stroke="#9c2828" stroke-width="3"/>
<path d="M668 134 V196" stroke="#9c2828" stroke-width="6"/>
<text x="644" y="113" font-family="Arial,sans-serif" font-size="18" fill="#263e52" text-anchor="middle">DEL</text>
<text x="612" y="218" font-family="Arial,sans-serif" font-size="15" fill="#344f62">Anode +</text>
<text x="683" y="218" font-family="Arial,sans-serif" font-size="15" fill="#344f62">Cathode −</text>
<path d="M668 165 H765" stroke="#5b7080" stroke-width="7" fill="none"/>
<rect x="765" y="130" width="155" height="70" rx="12" fill="#e1e7ed" stroke="#9caebb" stroke-width="3"/>
<text x="842" y="173" fill="#253d52" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" font-weight="700">GND</text>
<text x="50" y="278" fill="#4e6476" font-family="Arial,sans-serif" font-size="18">GPIO18 → 220 Ω → anode DEL (+) → cathode DEL (−) → GND</text>
</svg>